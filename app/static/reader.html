<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4b2a">
<title>Olvasó – Házikönyvtár</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#fbf8f3; --fg:#2a2420; --muted:#7b7068; --bar:#ffffff; --line:#e2d9cf; --accent:#7a4b2a; }
  body.dark { --bg:#1b1815; --fg:#e8e0d8; --muted:#a99d92; --bar:#26221e; --line:#3d362f; --accent:#d39a6a; }
  body.sepia { --bg:#f4ecd8; --fg:#4a3b2a; --muted:#8a7a63; --bar:#ece2c9; --line:#d9cba8; --accent:#7a4b2a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  .bar { position:fixed; left:0; right:0; z-index:5; display:flex; align-items:center; gap:4px;
    background:var(--bar); border-color:var(--line); padding:6px 8px; transition:transform .2s; }
  .top { top:0; border-bottom:1px solid var(--line); padding-top:max(6px, env(safe-area-inset-top)); }
  .bottom { bottom:0; border-top:1px solid var(--line); padding-bottom:max(6px, env(safe-area-inset-bottom)); }
  body.hide-ui .top { transform:translateY(-110%); }
  body.hide-ui .bottom { transform:translateY(110%); }
  .bar button, .bar a { border:0; background:transparent; color:var(--fg); font:inherit; font-size:1.05rem;
    min-width:40px; height:40px; border-radius:8px; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; justify-content:center; padding:0 8px; }
  .bar button:hover, .bar a:hover { background:rgba(127,127,127,.15); }
  .title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; padding:0 6px; }
  .progress { flex:1; text-align:center; color:var(--muted); font-size:.9rem; }
  #viewer { position:absolute; left:0; right:0; top:52px; bottom:52px; padding:0 4px; }
  @media (min-width: 900px) { #viewer { left:6%; right:6%; } }
  #toc { position:fixed; z-index:10; top:0; bottom:0; left:0; width:min(360px, 88vw); background:var(--bar);
    border-right:1px solid var(--line); overflow-y:auto; padding:12px 0; transform:translateX(-105%);
    transition:transform .2s; padding-top:max(12px, env(safe-area-inset-top)); }
  #toc.open { transform:none; box-shadow:4px 0 20px rgba(0,0,0,.25); }
  #toc h3 { margin:4px 16px 10px; }
  #toc a { display:block; padding:9px 16px; color:var(--fg); text-decoration:none; border-bottom:1px solid var(--line); }
  #toc a.sub { padding-left:32px; font-size:.92rem; }
  #toc a:hover { background:rgba(127,127,127,.12); }
  .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px; color:var(--muted); }
  .spin { width:28px; height:28px; border:3px solid var(--accent); border-right-color:transparent; border-radius:50%;
    animation:spin .8s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="bar top">
    <a id="backBtn" href="/" title="Vissza" aria-label="Vissza">←</a>
    <button id="tocBtn" title="Tartalomjegyzék" aria-label="Tartalomjegyzék">☰</button>
    <div class="title" id="title">Betöltés…</div>
    <button id="smaller" title="Kisebb betű" aria-label="Kisebb betű">A−</button>
    <button id="bigger" title="Nagyobb betű" aria-label="Nagyobb betű">A+</button>
    <button id="themeBtn" title="Téma" aria-label="Téma váltása">◐</button>
  </div>
  <div id="viewer"><div class="msg" id="msg"><div><div class="spin"></div>Könyv betöltése…</div></div></div>
  <div class="bar bottom">
    <button id="prev" title="Előző oldal" aria-label="Előző oldal">‹</button>
    <div class="progress" id="progress"></div>
    <button id="next" title="Következő oldal" aria-label="Következő oldal">›</button>
  </div>
  <nav id="toc"><h3>Tartalom</h3><div id="tocList"></div></nav>

<script src="/static/vendor/jszip.min.js"></script>
<script src="/static/vendor/epub.min.js"></script>
<script src="/static/reader.js?v=1"></script>
</body>
</html>
